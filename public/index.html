<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/logo.png"><title>المساعد — وقتك له قيمة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<div id=splash aria-hidden="true"><img src="/splash.jpg" alt=""></div>
<script>(function(){const s=document.getElementById('splash');if(!s)return;let seen=false;try{seen=sessionStorage.getItem('splashSeen')==='1'}catch(e){}
if(seen){s.remove();return}
try{sessionStorage.setItem('splashSeen','1')}catch(e){}
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const hold=reduce?300:2000;
const close=()=>{s.classList.add('hide');setTimeout(()=>s.remove(),600)};
setTimeout(close,hold);setTimeout(close,4000);
})();</script><header><nav id="nav"></nav></header><div id=menu class=menu-panel hidden></div><main id="app"></main>
<nav class=bnav id=bn aria-label="التنقل السفلي"></nav><footer class=foot id=ft></footer>
<script src="/app.js"></script>
