msgs.scrollTop=msgs.scrollHeight}
catch(x){w.remove();bot(`<span style="color:#8a2b1c">${esc(x.message||'حدث خطأ، حاول مرة أخرى.')}</span>`)}};

async function cancelChosen(id){const R=['المهمة لم تعد مطلوبة','المساعد لم يلتزم','ظرف طارئ','أخرى'];const i=prompt('سبب الإلغاء (اكتب الرقم):\n1) المهمة لم تعد مطلوبة\n2) المساعد لم يلتزم\n3) ظرف طارئ\n4) أخرى');const reason=R[+i-1];if(!reason)return toast('اختر سببًا صحيحًا',1);if(!confirm('سيُسجَّل هذا الإلغاء في سجلك وقد يؤثر على حسابك إذا تكرر. متابعة؟'))return;try{await api(`/requests/${id}/cancel`,'POST',{reason});toast('تم الإلغاء');detail(id)}catch(x){toast(x.message,1)}}

const LEGAL={terms:[['1. تعريف المنصة ودورها','«المساعد» منصة إلكترونية تقنية تتيح لطالب المساعدة عرض مهمة، وللمساعد التقدم لتنفيذها. المنصة وسيط تقني فقط، ولا تُعد طرفًا في أي اتفاق بين الطرفين، ولا تُعد صاحب عمل أو وكيلًا أو شريكًا لأي منهما، ولا تضمن جودة التنفيذ أو صحة ما يقدّمه أي طرف.'],['1 مكرر. الاتفاقات بين الطرفين','أي اتفاق على المهمة أو السعر أو الموعد أو طريقة التنفيذ يتم مباشرة بين طالب المساعدة والمساعد، وتقع مسؤوليته عليهما وحدهما. المنصة غير مسؤولة عن أي نزاع أو ضرر أو إخلال ينشأ عن هذا الاتفاق، بما في ذلك جودة العمل وتأخيره وإلغائه والتزامات الطرفين تجاه بعضهما. يقتصر دور المنصة على توفير المساحة التقنية وسجل المحادثات والإجراءات المعروضة، ولها حق إخفاء أي محتوى مخالف أو تعليق حساب بعد المراجعة دون أن يُعد ذلك تدخلًا في الاتفاق.'],['2. الأهلية','يجب أن يكون عمرك 18 سنة على الأقل، وأن تقدّم بيانات صحيحة وكاملة عند التسجيل، وأن تحافظ على سرية كلمة المرور. أنت مسؤول عن كل ما يتم من حسابك.'],['3. الطلبات والمهام','تنشر طالب المساعدة طلبك بوصف واضح وصادق، ويتفق الطرفان مباشرة على السعر والموعد والشروط. لا يجوز نشر طلبات مخالفة للأنظمة أو تتضمن محتوى مسيئًا أو احتيالًا أو طلبات تضر بالآخرين.'],['4. السعر والدفع','يُعتمد السعر النهائي من الطرفين داخل المنصة. يتم الدفع بالتحويل المباشر بين الطرفين وفق الإجراءات المعروضة في المنصة، وتؤكد المنصة ما تراه من إثباتات دون أن تكون طرفًا في التحويل. لا تستلم المنصة أموال المهام ولا تحتفظ بها.'],['5. عمولة المنصة','يلتزم المساعد بسداد عمولة المنصة وفق النسبة والمهلة المعلنتين في المنصة، والتعهد الذي يوقّعه عند التسجيل جزء من هذه الشروط.'],['6. الإلغاء والعقوبات','الإلغاء بعد اختيار المساعد يُسجَّل في سجل الحساب، وقد يؤدي تكراره خلال 30 يومًا إلى تنبيه أو إيقاف مؤقت للنشر والتقدم أو قيد يتطلب مراجعة الإدارة، وفق الحدود المعلنة في المنصة.'],['7. المحتوى والبلاغات','أنت مسؤول عن المحتوى الذي تنشره أو ترسله، ويحق للمنصة إخفاء أي محتوى مخالف أو تعليق الحساب بعد مراجعة، ويمكن لأي مستخدم الإبلاغ عن محتوى أو سلوك مخالف.'],['8. حدود المسؤولية','لا تتحمل المنصة أي خسارة أو ضرر مباشر أو غير مباشر ناتج عن تنفيذ المهام أو عدم تنفيذها، أو عن تصرفات أي من الطرفين، أو عن الاتفاقات بينهما، أو عن انقطاع الخدمة أو الأخطاء التقنية، إلى الحد الذي تسمح به الأنظمة السعودية. ولا تتجاوز مسؤولية المنصة في أي حال المبلغ الذي تحصّلته منك كعمولة عن المهمة محل النزاع.'],['9. الملكية الفكرية','الشعار والتصميم والنصوص والبرمجيات في المنصة ملك للمؤسسة المالكة للمنصة، ولا يجوز نسخها أو إعادة استخدامها دون إذن كتابي.'],['10. النزاعات والقانون الواجب التطبيق','تخضع هذه الشروط لأنظمة المملكة العربية السعودية، وتُحال المنازعات الناشئة عنها إلى الجهة المحددة في بند الاختصاص المعتمد لدى المنصة.'],['11. التعديل والإنهاء','يحق للمنصة تعديل هذه الشروط، ويُعلن عن التعديل داخل الموقع. ويحق لك إغلاق حسابك بالتواصل مع الإدارة، مع بقاء الالتزامات المستحقة قبل الإغلاق.']],privacy:[['1. البيانات التي نجمعها','الاسم والبريد الإلكتروني والجوال والمدينة والعنوان، وبيانات الطلبات والمحادثات والصور المرفقة، وسجل النقاط والإشعارات، وعند توقيع التعهد: عنوان الشبكة (IP) ونوع المتصفح ووقت الموافقة.'],['2. أغراض الاستخدام','تقديم خدمات المنصة، وتوثيق التعهد، ومعالجة الدفعات والعمولات، ومنع الاحتيال وإساءة الاستخدام، والرد على البلاغات، والالتزام بالأنظمة.'],['3. مع من نشارك البيانات','تظهر بعض بياناتك للطرف الآخر في المهمة بالقدر اللازم (مثل الاسم والمدينة)، وتطّلع عليها إدارة المنصة. ويجوز الإفصاح للجهات القضائية والرسمية عند الطلب وفق الأنظمة. لا نبيع بياناتك.'],['4. الحماية','نستخدم الحماية التقنية المناسبة، منها تشفير كلمات المرور، وجلسات آمنة، وصلاحيات محددة للإدارة، وتسجيل العمليات الحساسة. لا توجد حماية مطلقة، ونلتزم بإبلاغ المتضررين وفق الأنظمة عند أي اختراق.'],['5. مدة الحفظ','نحتفظ بالبيانات طوال فترة الحساب ومدة إضافية تتطلبها الأنظمة والالتزامات المالية والنزاعات، ثم تُحذف أو تُجهّل حسب ما تسمح به الأنظمة.'],['6. حقوقك','لك الحق في الاطلاع على بياناتك وتصحيحها، وطلب حذف الحساب، وسحب موافقتك حيث تكون الموافقة هي الأساس، والاعتراض على المعالجة في الحدود التي يقررها النظام. تُقدَّم الطلبات من خلال الإدارة.'],['7. ملفات تعريف الارتباط','تستخدم المنصة ملف جلسة واحدًا لإبقائك مسجّل الدخول، ولا نستخدم ملفات تتبع إعلانية.'],['8. الفئات العمرية','المنصة مخصصة للبالغين فقط، ولا نجمع عن قصد بيانات من هم دون 18 سنة.'],['9. التعديلات','قد نعدّل هذه السياسة، ويُعلن عن أي تعديل مهم داخل الموقع.']]};
const orgInfo=async()=>{try{return await api('/org')}catch{return{}}};
async function renderFooter(){const o=await orgInfo(),ph=o.support_phone?`<a href="tel:${esc(o.support_phone.replace(/\s/g,''))}" dir=ltr>${esc(o.support_phone)}</a>`:'',em=o.support_email?`<a href="mailto:${esc(o.support_email)}" dir=ltr>${esc(o.support_email)}</a>`:'';
$('#ft').innerHTML=`<div class=ft-grid><div><b class=ft-logo>المساعد</b><p>منصة تربط طالب المساعدة بالمساعد بعقد واضح وسعر متفق عليه قبل البدء.</p></div><div><h4>المنصة</h4><a href="#/">الرئيسية</a><a href="#/about">من نحن</a><a href="#/contact">تواصل معنا</a></div><div><h4>قانوني</h4><a href="#/terms">الشروط والأحكام</a><a href="#/privacy">سياسة الخصوصية</a></div><div><h4>تواصل معنا</h4>${em||'<span>البريد قريبًا</span>'}${ph}${o.support_address?`<p>${esc(o.support_address)}</p>`:''}</div></div><div class=ft-bot><span>© ${new Date().getFullYear()} ${esc(o.org_name||'المساعد')}</span>${o.org_cr?`<span>سجل تجاري ${esc(o.org_cr)}</span>`:''}</div>`}
async function about(){const o=await orgInfo(),name=esc(o.org_name||'المساعد');
app.innerHTML=`<section class=pg-hero><h1>من نحن</h1><p>${esc(name)} منصة سعودية تربط من يحتاج مساعدة في مهامه اليومية بمن لديه الوقت والمهارة لإنجازها، بعقد واضح وسعر متفق عليه قبل البدء.</p></section>
<div class=cards3><div class=card3><span class=n>1</span><h3>طلب وعرض</h3><p>تنشر طلبك بوصف واضح، ويتقدم لك من يناسبك، وأنت تختار بنفسك.</p></div><div class=card3><span class=n>2</span><h3>أمان وشفافية</h3><p>تعهد إلكتروني، وسجل محادثات وتحويلات، ومراجعة الإدارة للبلاغات.</p></div><div class=card3><span class=n>3</span><h3>سمعة مبنية على التقييم</h3><p>كل مهمة مكتملة تُقيَّم من الطرفين، لتعرف من تتعامل معه قبل أن تبدأ.</p></div></div>
<section class=panel><h2 style="margin-top:0">كيف تعمل المنصة</h2><div class=cards3><div class=card3><span class=n>1</span><h3>انشر طلبك</h3><p>اشرح المهمة والموقع والمبلغ المقترح.</p></div><div class=card3><span class=n>2</span><h3>اختر المساعد</h3><p>اتفق معه على السعر النهائي داخل المنصة.</p></div><div class=card3><span class=n>3</span><h3>أنجز وقيّم</h3><p>حوّل المبلغ بعد الاتفاق، وقيّم التجربة عند الإنجاز.</p></div></div></section>
<section class=panel><h2 style="margin-top:0">مبادئنا</h2><p>الوضوح في الاتفاقات، والاحترام بين الطرفين، والمسؤولية عن كل ما يُنشر ويُتفق عليه داخل المنصة.</p></section>
<div class=pg-cta><a class=btn href="#/new">أضف طلبك الآن</a> <a class="btn alt" href="#/contact">تواصل معنا</a></div>`}
async function contact(){const o=await orgInfo(),row=(l,v,href)=>`<div class=ct-row><small>${l}</small>${v?(href?`<a href="${href}" dir=ltr>${esc(v)}</a>`:`<b>${esc(v)}</b>`):'<b>غير متوفر بعد</b>'}</div>`;
app.innerHTML=`<section class=pg-hero><h1>تواصل معنا</h1><p>فريق الدعم يرد على استفساراتك ومشكلاتك التقنية والمتعلقة بالطلبات والمدفوعات.</p></section>
<section class=panel>${row('البريد الإلكتروني',o.support_email,o.support_email?'mailto:'+esc(o.support_email):'')}${row('رقم الجوال',o.support_phone,o.support_phone?'tel:'+esc(o.support_phone.replace(/\s/g,'')):'')}${row('العنوان',o.support_address)}</section>
<section class=panel><h2 style="margin-top:0">أسئلة شائعة</h2>
<details class=faq><summary>كيف أنشر طلبًا؟</summary><p>سجّل دخولك، واضغط «أضف طلبك الآن»، واملأ البيانات ثم عاين الطلب وانشره.</p></details>
<details class=faq><summary>كيف يتم الدفع؟</summary><p>يتفق الطرفان على السعر داخل المنصة، ثم يحوّل طالب المساعدة المبلغ مباشرة إلى المساعد، ويؤكد المساعد الاستلام.</p></details>
<details class=faq><summary>ما هي عمولة المنصة؟</summary><p>يسدد المساعد عمولة المنصة وفق النسبة المعلنة عند التسجيل، وتفاصيلها في التعهد.</p></details>
<details class=faq><summary>نسيت كلمة المرور، ماذا أفعل؟</summary><p>استعادة كلمة المرور ستتوفر قريبًا. حتى ذلك تواصل معنا عبر البريد.</p></details></section>
<section class=panel><h3 style="margin-top:0">تنبيه أمني</h3><p>فريق المنصة لا يطلب منك كلمة المرور أو رموز التحقق أبدًا، لا عبر الهاتف ولا عبر الرسائل. إذا وصلك طلب من هذا النوع فلا تستجب له وأبلغنا.</p></section>`}
function forgot(){app.innerHTML=`<section class=auth><div class=auth-head><span class=mark-lg><img src=/hand.png alt=""></span><h1>استعادة كلمة المرور</h1><p>أدخل بريدك الإلكتروني، وسنرسل لك رابطًا لإنشاء كلمة مرور جديدة.</p></div><form id=fg class=auth-form><label>البريد الإلكتروني<input name=email type=email required autocomplete=email dir=ltr></label><button class=btn>إرسال الرابط</button></form><p class=auth-alt id=fgm></p></section>`;
$('#fg').onsubmit=sub(async b=>{await api('/forgot','POST',b);$('#fgm').textContent='إذا كان البريد مسجلًا لدينا، ستصلك رسالة خلال دقائق. تحقق من مجلد الرسائل غير المرغوب فيها.';$('#fg').querySelector('button').disabled=true})}
function resetPage(token){app.innerHTML=`<section class=auth><div class=auth-head><span class=mark-lg><img src=/hand.png alt=""></span><h1>كلمة مرور جديدة</h1><p>اكتب كلمة مرور جديدة، وستنتهي كل الجلسات القديمة.</p></div><form id=rp class=auth-form><label>كلمة المرور الجديدة<input name=password type=password minlength=8 required autocomplete=new-password dir=ltr placeholder="8 أحرف على الأقل"></label><button class=btn>حفظ كلمة المرور</button></form></section>`;
$('#rp').onsubmit=sub(async b=>{await api('/reset','POST',{token,password:b.password});toast('تم تغيير كلمة المرور، سجّل دخولك');location.hash='#/login'})}
async function provider(id){const p=await api('/providers/'+id),star=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));
app.innerHTML=`<section class=phead><div class=av-lg>${esc(p.name[0]||'؟')}</div><div class=grow><h2>${esc(p.name)}</h2><small>${esc(p.city||'')}</small><div class=chips><span class=chip>أنجز ${p.done} مهمة</span>${p.avg!=null?`<span class=chip>★ ${p.avg} (${p.count} تقييم)</span>`:'<span class=chip>لا توجد تقييمات بعد</span>'}</div></div></section>
${me.user&&me.user.id!==p.id?`<section class=panel><h3 style="margin-top:0">محادثة مباشرة</h3><small>للاستفسار قبل الطلب. إثبات التحويل والدفع يكون داخل الطلب فقط.</small><div id=dmsgs class=dmsgs></div><form id=dform class=row style="gap:8px"><input name=body maxlength=1000 placeholder="اكتب استفسارك" aria-label="اكتب استفسارك" style="flex:1"><button type=button class="btn alt" id=dpic aria-label="إرفاق صورة">${ic(I.clip)}</button><button class=btn>إرسال</button></form></section>`:''}<section class=panel><h3 style="margin-top:0">نبذة</h3><p class=pre>${p.bio?esc(p.bio):'لم يكتب المساعد نبذة بعد.'}</p></section>
<section class=panel><h3 style="margin-top:0">المهارات</h3><div class=chips>${p.skills.map(s=>`<span class=chip>${esc(s)}</span>`).join('')||'<small>لا توجد مهارات معتمدة بعد</small>'}</div></section>
<section class=panel><h3 style="margin-top:0">أعماله</h3><div class=gal>${p.portfolio.map(x=>`<figure><img src=/api/files/${x.attachment_id} alt="${esc(x.caption||'عمل')}"><figcaption>${esc(x.caption||'')}</figcaption></figure>`).join('')||'<small>لم يضف صورًا لأعماله بعد.</small>'}</div></section>
<section class=panel><h3 style="margin-top:0">التقييمات</h3>${p.reviews.map(r=>`<div class=item><div class=row><b>${esc(r.name)}</b><span>${star(r.stars)}</span></div>${r.comment?`<small>${esc(r.comment)}</small>`:''}<small>${r.at}</small></div>`).join('')||'<div class=empty>لا توجد تقييمات بعد.</div>'}</section>
<section class=panel><h3 style="margin-top:0">التواصل</h3><p>للتواصل مع ${esc(p.name.split(' ')[0])} انشر طلبك، وسيتقدم لك، ويمكنكما المحادثة داخل الطلب.</p><a class=btn href="#/new">انشر طلبًا</a></section>`;if(me.user&&me.user.id!==p.id)dchatInit(p.id)}
async function dchatInit(id){const box=$('#dmsgs'),form=$('#dform');const load=async()=>{const d=await api('/direct/'+id);form.hidden=d.blocked;if(d.blocked){box.innerHTML='<div class=empty>لا يمكن التواصل مع هذا المستخدم.</div>';return}
box.innerHTML=d.messages.map(m=>`<div class="bub ${m.from_id===me.user.id?'u':'b'}">${m.attachment_id?`<img class=pic src=/api/files/${m.attachment_id} alt="">`:''}${esc(m.body)}<small class=btime>${String(m.created_at).slice(11,16)}</small></div>`).join('')||'<div class=empty>ابدأ الاستفسار</div>';box.scrollTop=box.scrollHeight};
try{await load()}catch(x){toast(x.message,1)}
form.onsubmit=sub(async(b,t)=>{try{await api('/direct/'+id,'POST',{body:b.body});t.elements.body.value='';await load()}catch(x){toast(x.message,1)}});
$('#dpic').onclick=async()=>{try{const attachment_id=await pick();await api('/direct/'+id,'POST',{body:'',attachment_id});await load()}catch(x){toast(x.message,1)}}}
const legal=kind=>{const t=kind==='terms'?'الشروط والأحكام':'سياسة الخصوصية';app.innerHTML=`<section class=legal><h1>${t}</h1><p class=draft>مسودة: هذا النص لم يُعتمد بعد، ويجب مراجعته من محامٍ مختص قبل نشره رسميًا.</p><div id=lgs>${LEGAL[kind].map(([h,b])=>`<h2>${esc(h)}</h2><p>${esc(b)}</p>`).join('')}</div><p class=meta-l id=lo></p></section>`;
orgInfo().then(o=>{const txt=o[kind==='terms'?'terms_text':'privacy_text'];if(txt)$('#lgs').innerHTML=txt.split(/\n\s*\n/).map(x=>`<p>${esc(x.trim())}</p>`).join('');$('#lo').innerHTML=`المنشأة المالكة للمنصة: ${o.org_name?esc(o.org_name)+(o.org_cr?'، سجل تجاري رقم '+esc(o.org_cr):''):'[اسم المؤسسة ورقم السجل التجاري]'}`})};
const routes=[[/^#\/verify\/([0-9a-f]{64})$/,verifyPage],[/^#\/chats$/,chats],[/^#\/chat\/(\d+)\/(\d+)$/,chatPage],[/^#\/r\/(\d+)$/,detail],[/^#\/new$/,newReq],[/^#\/profile$/,profile],[/^#\/notifs$/,notifs],[/^#\/login$/,()=>auth(false)],[/^#\/register$/,()=>auth(true)],[/^#\/about$/,about],[/^#\/contact$/,contact],[/^#\/forgot$/,forgot],[/^#\/reset\/([0-9a-f]{64})$/,resetPage],[/^#\/p\/(\d+)$/,provider],[/^#\/terms$/,()=>legal('terms')],[/^#\/privacy$/,()=>legal('privacy')],[/^#\/admin$/,admin],[/^#\/mine$/,mine]];
async function route(){const h=location.hash||'#/';nav();document.body.classList.toggle('home',h==='#/'||h==='#'||h==='');if(/#\/(new|profile|notifs|admin|mine|chats|chat)/.test(h)&&!me.user)return location.hash='#/login';
for(const[re,f]of routes){const m=re.exec(h);if(m){try{await f(m[1],m[2])}catch(e){app.innerHTML=`<div class=empty>${esc(e.message)}</div>`}return}}
if(h==='#list'||h==='#/'||h==='#')return home();home()}
const modal=(t,x)=>{const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class=mo><h3 style="margin:0">${esc(t)}</h3><div class=pre>${esc(x)}</div><button class=btn>إغلاق</button></div>`;o.querySelector('button').onclick=()=>o.remove();document.body.append(o)};

async function pledgeGate(){if(!me.user||$('#pg'))return;let p;try{p=await api('/pledge')}catch{return}if(p.accepted||!p.ready)return;const u=me.user,o=document.createElement('div');o.className='ov';o.id='pg';
o.innerHTML=`<form class=mo><h2 style="margin:0">تعهد والتزام بسداد عمولة المنصة</h2><p style="text-align:center;font-size:20px;color:var(--g);margin:0">﴿وَأَوْفُوا بِالْعَهْدِ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾</p><small>لصالح: ${esc(p.org)}، سجل تجاري ${esc(p.org_cr)}، مالكة منصة «المساعد»</small><div class=pre style="max-height:34vh;overflow:auto;border:1px solid var(--b);border-radius:10px;padding:10px">${esc(p.body)}</div><input name=name value="${esc(u.name)}" placeholder="الاسم الكامل" required><label><input type=checkbox name=accept required style="width:auto"> أقرّ بأنني قرأت التعهد وأوافق عليه، وأعد موافقتي الإلكترونية توقيعًا نظاميًا ملزمًا لي.</label><button class=btn>أؤكد التعهد</button></form>`;
document.body.append(o);o.querySelector('form').onsubmit=sub(async b=>{await api('/pledge','POST',b);o.remove();await boot();toast('تم تسجيل تعهدك')})}
function verifyBanner(){if(!me.user||$('#vb'))return;const noMail=me.user.email_verified===0,noPhone=!me.user.phone;if(!noMail&&!noPhone)return;const d=document.createElement('div');d.id='vb';d.className='mo';d.innerHTML='<div class=mo-box style="text-align:center">'+(noPhone?'<p>أضف رقم جوالك في الملف الشخصي، فهو مطلوب لنشر الطلبات والتقدم للمهام.</p><button class=btn type=button id=vbp>إضافة الجوال</button> ':'')+(noMail?'<p>لم تفعّل بريدك الإلكتروني بعد. تفعيله مطلوب لنشر الطلبات والتقدم للمهام.</p><button class=btn type=button id=vbr>إعادة إرسال رابط التفعيل</button> ':'')+'<button class="btn alt" type=button id=vbx>لاحقًا</button></div>';document.body.append(d);$('#vbx').onclick=()=>d.remove();if($('#vbp'))$('#vbp').onclick=()=>{d.remove();location.hash='#/profile'};if($('#vbr'))$('#vbr').onclick=async()=>{try{await api('/me/resend-verification','POST');toast('أرسلنا رابط التفعيل إلى بريدك')}catch(x){toast(x.message,1)}}}
async function verifyPage(tok){app.innerHTML=`<section class=auth><h1>تفعيل البريد الإلكتروني</h1><p id=vmsg>جاري التفعيل…</p></section>`;try{await api('/verify-email','POST',{token:tok});$('#vmsg').textContent='تم تفعيل بريدك بنجاح.';const d=document.getElementById('vb');if(d)d.remove()}catch(x){$('#vmsg').textContent=x.message}}
async function boot(){me=await api('/me');route();pledgeGate();verifyBanner();renderFooter()}
addEventListener('hashchange',route);boot();
</script>
